symbols: ["BTCUSDT", "ETHUSDT"]
data:
  base_path: "../data_futures"
  kline_window: "3s"
  price_column: "vwap"
time_range:
  start_time: "2023-01-01 00:00:00"
  end_time: "2025-01-01 00:00:00"
  interval: "1m"
returns:
  delays: ["9s", "15s"]
  periods: ["1m", "5m", "15m", "30m", "1h", "2h", "4h", "8h", "12h", "1d", "2d"]
batch:
  batch_days: 30
  margin_days: 7
output:
  dir: "output"
  filename_pattern: "{symbol}_returns.parquet"
