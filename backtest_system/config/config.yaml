
backtest:
  start_time: "2023-01-01 00:00:00"
  end_time: "2023-01-02 00:00:00"
  frequency: "1min"
  initial_usdt: 100000
  symbols: ["BTCUSDT", "ETHUSDT"]

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"

data_loader:
  aggtrade:
    time_unit: "ms"
    path_template: "../data_futures/{symbol}/aggTrades/{symbol}-aggTrades-{YYYY}-{MM}-{DD}.parquet"
  signal:
    time_unit: "ms"
    timestamp_path: "../signals/timestamps.npy"
    signal_path: "../signals/signals.npy"
  funding_rate:
    time_unit: "ms"
    path_template: "../data_futures/{symbol}/fundingRate/{symbol}-fundingRate-{YYYY}-{MM}.parquet"

optimizer:
  class: "optimizer.simple_optimizer.SimpleOptimizer"
  params:
    signal_multiplier: 0.1
    max_position_value: 50000.0
    leverage: 1.0

executor:
  class: "executor.executor.Executor"
  params:
    execution_delay: 10
    execution_window: 20
    fee_rate: 0.0004
    slippage_rate: 0.0001
    max_volume_pct: 0.10

metrics:
  paths:
    trade_log: "logs/trade_log.csv"
    state_log: "logs/state_log.csv"
